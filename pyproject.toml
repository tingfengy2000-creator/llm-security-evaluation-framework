[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmguard-research-framework"
version = "0.1.0"
description = "Research framework for reproducible LLM, RAG, and agent security evaluation"
requires-python = ">=3.12"

[project.optional-dependencies]
stage6_rag_security = [
    "chromadb==1.5.9",
    "sentence-transformers==5.6.0",
    "Pillow==12.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
