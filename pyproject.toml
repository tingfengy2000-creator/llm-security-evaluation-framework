[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeguarder-llm-security-lab"
version = "0.1.0"
description = "可复现的大模型安全评测实验项目"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
